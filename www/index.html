<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>ICC — The Innovation Social Hub</title>
    <meta name="description" content="Innovators Creators Club — A social platform for innovators. Share ideas, join teams, collaborate, and build the future together.">
    <meta name="theme-color" content="#030303" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#030303">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="images/icon-192x192.png">

    <!-- Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ICC Hub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <!-- Open Graph -->
    <meta property="og:title" content="ICC — The Innovation Social Hub">
    <meta property="og:description" content="Share ideas, join teams, and innovate together with the Innovators Creators Club.">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Tailwind Theme Config -->
    <style type="text/tailwindcss">
        @theme {
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-obsidian: #030303;
            --color-crimson: #E11D48;
            --color-crimson-light: #FB7185;
            --color-crimson-dark: #9F1239;

            /* Scale up standard font sizes */
            --font-size-xs: 0.875rem;     /* 14px instead of 12px */
            --font-size-sm: 1rem;         /* 16px instead of 14px */
            --font-size-base: 1.125rem;   /* 18px instead of 16px */
            --font-size-lg: 1.25rem;      /* 20px instead of 18px */
            --font-size-xl: 1.5rem;       /* 24px instead of 20px */
            --font-size-2xl: 1.875rem;    /* 30px instead of 24px */
        }

        html {
            font-size: 17px; /* Increase base reference size */
        }

        a, a:link, a:visited, a:hover, a:focus, a:active, :-webkit-any-link, a *, :-webkit-any-link * {
            text-decoration: none !important;
            text-decoration-line: none !important;
            -webkit-text-decoration: none !important;
            -webkit-text-decoration-line: none !important;
        }
    </style>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-obsidian text-white font-body min-h-[100dvh] antialiased overflow-x-hidden">
    <!-- App Initial Splash Loading Screen -->
    <div id="app-splash-screen" class="fixed inset-0 z-[9999] bg-[#030303] flex flex-col items-center justify-center transition-all duration-500">
        <div class="relative flex flex-col items-center max-w-xs text-center px-4">
            <!-- Glowing Brand Aura -->
            <div class="absolute -inset-8 bg-rose-600/20 rounded-full blur-3xl animate-pulse pointer-events-none"></div>

            <!-- Glowing NxGen Logo -->
            <div class="relative w-24 h-24 bg-gradient-to-br from-rose-600/30 via-zinc-900/90 to-black rounded-2xl flex items-center justify-center shadow-[0_0_50px_rgba(225,29,72,0.6)] border border-rose-400/40 mb-6 icc-pulse-glow p-3 backdrop-blur-xl group">
                <img src="images/icon-512x512.png" alt="NxGen Logo" class="w-full h-full object-contain filter drop-shadow-[0_0_14px_rgba(225,29,72,0.85)] transition-transform duration-500 group-hover:scale-105" onerror="this.src='assets/icon.png'">
            </div>

            <!-- App Title & Tagline -->
            <h1 class="font-heading font-bold text-2xl text-white tracking-tight mb-1">ICC Social Hub</h1>
            <p class="text-xs text-zinc-400 font-medium tracking-wide mb-8">Innovators Creators Club</p>

            <!-- Animated Orbital Spinner -->
            <div class="icc-orbital-spinner mb-6">
                <div class="spinner-ring ring-1"></div>
                <div class="spinner-ring ring-2"></div>
                <div class="spinner-core"></div>
            </div>

            <!-- Status Text -->
            <p id="app-splash-status" class="text-xs text-rose-400/90 font-mono tracking-wider animate-pulse">Initializing Hub...</p>

            <!-- Loading Progress Bar -->
            <div class="w-48 h-1 bg-zinc-900 rounded-full overflow-hidden border border-white/5 mt-4">
                <div id="app-splash-bar" class="h-full bg-gradient-to-r from-rose-600 to-rose-400 transition-all duration-300 ease-out" style="width: 15%;"></div>
            </div>
        </div>
    </div>

    <!-- Route Progress Bar -->
    <div id="route-progress"></div>




    <!-- Global Sticky Top Bar -->
    <header class="sticky top-0 z-[500] w-full bg-obsidian/80 backdrop-blur-xl border-b border-zinc-800/50 h-16 flex items-center justify-between px-4">
        <div id="sidebar-toggle-root"></div>
        <a href="#dashboard" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
            <div class="w-8 h-8 bg-gradient-to-br from-crimson to-crimson-dark rounded-lg flex items-center justify-center font-heading font-bold text-[10px]">ICC</div>
            <span class="font-heading font-bold text-sm tracking-tight">Social Hub</span>
        </a>
        <div id="notif-bell-root"></div>
    </header>

    <!-- Modal Root (Auth, Create Post, User Profile) -->
    <div id="modal-root"></div>

    <!-- Main App View Container -->
    <main id="app" class="relative pb-32"></main>

    <!-- Bottom Navigation Mount -->
    <div id="bottom-nav-root"></div>

    <!-- Toast Notifications -->
    <div id="toast-root" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[10000] flex flex-col items-center gap-2.5 pointer-events-none w-max max-w-[90vw]"></div>

    <!-- Floating Particles Background -->
    <div id="particles-bg" class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true"></div>

    <!-- Application Scripts (order matters) -->
    <script src="js/config.js?v=2"></script>
    <script src="js/studentData.js?v=2"></script>
    <script src="js/data.js?v=2"></script>
    <script src="js/supabase.js?v=2"></script>
    <script src="js/components/toast.js?v=2"></script>
    <script src="js/components/errorHandler.js?v=2"></script>
    <script src="js/components/sidebar.js?v=2"></script>
    <script src="js/components/imageViewer.js?v=2"></script>
    <script src="js/components/notifBell.js?v=2"></script>
    <script src="js/components/bottomNav.js?v=2"></script>
    <script src="js/allowedEmails.js?v=2"></script>
    <script src="js/components/authModal.js?v=2"></script>
    <script src="js/components/postCard.js?v=2"></script>
    <script src="js/components/createPostModal.js?v=2"></script>
    <script src="js/components/chatPanel.js?v=2"></script>
    <script src="js/components/userProfileModal.js?v=2"></script>
    <script src="js/components/joinTeamModal.js?v=2"></script>
    <script src="js/components/teamChatModal.js?v=2"></script>
    <script src="js/views/dashboard.js?v=2"></script>
    <script src="js/views/feed.js?v=2"></script>
    <script src="js/views/teams.js?v=2"></script>
    <script src="js/views/chat.js?v=2"></script>
    <script src="js/views/profile.js?v=2"></script>
    <script src="js/views/onboarding.js?v=2"></script>
    <script src="js/views/admin.js?v=2"></script>
    <script src="js/views/inventory.js?v=2"></script>
    <script src="js/views/attendance.js?v=2"></script>
    <script src="js/views/notifications.js?v=2"></script>
    <script src="js/views/download.js?v=2"></script>
    <script src="js/views/events.js?v=2"></script>
    <script src="js/views/eventDetail.js?v=2"></script>
    <script src="js/components/androidNavigation.js?v=2"></script>
    <script src="js/router.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
