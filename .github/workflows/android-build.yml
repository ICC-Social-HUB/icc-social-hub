name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Web Assets to Android
        run: |
          mkdir -p www
          cp index.html www/
          cp -r js www/
          cp -r css www/
          cp -r assets www/ || echo "No assets folder"
          cp -r images www/ || echo "No images folder"
          cp manifest.json www/ || echo "No manifest.json"
          npx cap sync android

      - name: Make gradlew executable
        run: |
          sed -i 's/\r$//' ./android/gradlew
          chmod +x ./android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Prepare APK for Website
        run: |
          mkdir -p assets
          cp android/app/build/outputs/apk/debug/app-debug.apk assets/icc-social-hub.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/icc-social-hub.apk
          git commit -m "chore: update latest apk [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: assets/icc-social-hub.apk
