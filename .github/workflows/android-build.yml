name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'package.json'
      - 'android/**'
      - 'capacitor.config.json'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Web Assets to Android
        run: |
          mkdir -p www
          cp index.html www/
          cp -r js www/
          cp -r css www/
          cp -r assets www/ || echo "No assets folder"
          cp -r images www/ || echo "No images folder"
          cp manifest.json www/ || echo "No manifest.json"
          npx cap sync android

      - name: Make gradlew executable
        run: |
          sed -i 's/\r$//' ./android/gradlew
          chmod +x ./android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}"

      - name: Prepare APK Output
        run: |
          mkdir -p assets
          cp android/app/build/outputs/apk/debug/app-debug.apk assets/icc-social-hub.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: assets/icc-social-hub.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ICC Social Hub Latest APK Build"
          body: "Latest compiled Android APK build for ICC Social Hub."
          draft: false
          prerelease: false
          files: assets/icc-social-hub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
