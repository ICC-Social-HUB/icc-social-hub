<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>ICC — The Innovation Social Hub</title>
    <meta name="description" content="Innovators Creators Club — A social platform for innovators. Share ideas, join teams, collaborate, and build the future together.">
    <meta name="theme-color" content="#030303" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#030303">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="images/icon-192x192.png">

    <!-- Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ICC Hub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <!-- Open Graph -->
    <meta property="og:title" content="ICC — The Innovation Social Hub">
    <meta property="og:description" content="Share ideas, join teams, and innovate together with the Innovators Creators Club.">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Tailwind Theme Config -->
    <style type="text/tailwindcss">
        @theme {
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-obsidian: #030303;
            --color-crimson: #E11D48;
            --color-crimson-light: #FB7185;
            --color-crimson-dark: #9F1239;

            /* Scale up standard font sizes */
            --font-size-xs: 0.875rem;     /* 14px instead of 12px */
            --font-size-sm: 1rem;         /* 16px instead of 14px */
            --font-size-base: 1.125rem;   /* 18px instead of 16px */
            --font-size-lg: 1.25rem;      /* 20px instead of 18px */
            --font-size-xl: 1.5rem;       /* 24px instead of 20px */
            --font-size-2xl: 1.875rem;    /* 30px instead of 24px */
        }

        html {
            font-size: 17px; /* Increase base reference size */
        }
    </style>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-obsidian text-white font-body min-h-[100dvh] antialiased overflow-x-hidden">
    <!-- Route Progress Bar -->
    <div id="route-progress"></div>




    <!-- Global Sticky Top Bar -->
    <header class="sticky top-0 z-[500] w-full bg-obsidian/80 backdrop-blur-xl border-b border-zinc-800/50 h-16 flex items-center justify-between px-4 md:pl-[72px]">
        <div id="sidebar-toggle-root"></div>
        <a href="#dashboard" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
            <div class="w-8 h-8 bg-gradient-to-br from-crimson to-crimson-dark rounded-lg flex items-center justify-center font-heading font-bold text-[10px]">ICC</div>
            <span class="font-heading font-bold text-sm tracking-tight">Social Hub</span>
        </a>
        <div id="notif-bell-root"></div>
    </header>

    <!-- Modal Root (Auth, Create Post, User Profile) -->
    <div id="modal-root"></div>

    <!-- Main App View Container -->
    <main id="app" class="relative pb-32"></main>

    <!-- Bottom Navigation Mount -->
    <div id="bottom-nav-root"></div>

    <!-- Toast Notifications -->
    <div id="toast-root" class="fixed top-20 right-4 z-[300] space-y-2 pointer-events-none"></div>

    <!-- Floating Particles Background -->
    <div id="particles-bg" class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true"></div>

    <!-- Application Scripts (order matters) -->
    <script src="js/config.js?v=2"></script>
    <script src="js/studentData.js?v=2"></script>
    <script src="js/data.js?v=2"></script>
    <script src="js/supabase.js?v=2"></script>
    <script src="js/components/toast.js?v=2"></script>
    <script src="js/components/sidebar.js?v=2"></script>
    <script src="js/components/imageViewer.js?v=2"></script>
    <script src="js/components/notifBell.js?v=2"></script>
    <script src="js/components/bottomNav.js?v=2"></script>
    <script src="js/allowedEmails.js?v=2"></script>
    <script src="js/components/authModal.js?v=2"></script>
    <script src="js/components/postCard.js?v=2"></script>
    <script src="js/components/createPostModal.js?v=2"></script>
    <script src="js/components/chatPanel.js?v=2"></script>
    <script src="js/components/userProfileModal.js?v=2"></script>
    <script src="js/components/joinTeamModal.js?v=2"></script>
    <script src="js/components/teamChatModal.js?v=2"></script>
    <script src="js/views/dashboard.js?v=2"></script>
    <script src="js/views/feed.js?v=2"></script>
    <script src="js/views/teams.js?v=2"></script>
    <script src="js/views/chat.js?v=2"></script>
    <script src="js/views/profile.js?v=2"></script>
    <script src="js/views/onboarding.js?v=2"></script>
    <script src="js/views/admin.js?v=2"></script>
    <script src="js/views/inventory.js?v=2"></script>
    <script src="js/views/attendance.js?v=2"></script>
    <script src="js/views/notifications.js?v=2"></script>
    <script src="js/views/download.js?v=2"></script>
    <script src="js/router.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
